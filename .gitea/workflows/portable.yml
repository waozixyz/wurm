name: Wurm portable download

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        required: true
        default: zx
        options: [zx]

permissions:
  contents: read

concurrency:
  group: wurm-portable
  cancel-in-progress: false

jobs:
  zx:
    if: github.ref == 'refs/heads/master' && inputs.target == 'zx'
    runs-on: build-native-wurm-zx
    timeout-minutes: 45
    env:
      ZIRAN_PAR_THREADS: '1'
      MAKEFLAGS: -j1
      OMP_NUM_THREADS: '1'
      YUE_DESKTOP_RECOVERY: '0'
    defaults:
      run:
        working-directory: waozixyz/wurm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          path: waozixyz/wurm
          persist-credentials: false
      - name: Resolve first-party sources on Gitea
        run: |
          git config --global url.https://git.waozi.xyz/waozi/.insteadOf https://github.com/waozixyz/
          git config --global url.https://git.waozi.xyz/ziranlang/.insteadOf https://github.com/ziranlang/
          git config --global url.https://git.waozi.xyz/kryonlabs/.insteadOf https://github.com/kryonlabs/
      - name: Set up the locked compiler and packages
        uses: https://git.waozi.xyz/ziranlang/ziran/.github/actions/setup@979159a55bcf1f9edb9eb8f26ea10aca421412e2
        with:
          project: waozixyz/wurm
          path: ziranlang/ziran
          fetch: true
          packages: build-essential python3 zlib1g-dev
      - name: Build the game-owned portable downloads
        run: |
          python3 tests/portable_export_test.py
          python3 tools/build_portable.py
          python3 tests/portable_export_test.py --built
      - name: Keep Wurm's portable downloads
        uses: actions/upload-artifact@v4
        with:
          name: wurm-portable
          path: |
            waozixyz/wurm/build/downloads/wurm.zx
            waozixyz/wurm/build/downloads/wurm-portable-v*.tar.gz
          if-no-files-found: error
          retention-days: 7
