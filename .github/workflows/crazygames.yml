name: CrazyGames

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wurm-crazygames
  cancel-in-progress: false

jobs:
  build:
    name: Build and test CrazyGames edition
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZIRAN_PAR_THREADS: '1'
      MAKEFLAGS: -j1
      OMP_NUM_THREADS: '1'
      YUE_DESKTOP_RECOVERY: '0'
    defaults:
      run:
        working-directory: waozixyz/wurm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: waozixyz/wurm
          persist-credentials: false
      - name: Set up locked Ziran and build tools
        uses: ziranlang/ziran/.github/actions/setup@979159a55bcf1f9edb9eb8f26ea10aca421412e2
        with:
          project: waozixyz/wurm
          path: ziranlang/ziran
          fetch: true
          packages: >-
            build-essential cmake pkg-config zlib1g-dev ffmpeg libssl-dev
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
          actions-cache-folder: emsdk-cache
      - name: Build CrazyGames package
        env:
          LDLIBS: -lz
          CRAZYGAMES_LEADERBOARD_KEY: ${{ secrets.CRAZYGAMES_LEADERBOARD_KEY }}
          CRAZYGAMES_ADS_ENABLED: ${{ vars.CRAZYGAMES_ADS_ENABLED || 'false' }}
        run: |
          export EMCC="$(command -v emcc)"
          ziran run --target=c tools/build_web.zi -- crazygames
      - name: Test CrazyGames package
        env:
          LDLIBS: -lz
        run: |
          CHROMIUM="$(command -v google-chrome || command -v chromium)" ziran run --target=c tests/run_local.zi -- crazygames
      - name: Upload tested web root
        uses: actions/upload-artifact@v4
        with:
          name: wurm-crazygames
          path: waozixyz/wurm/build/crazygames/web/
          if-no-files-found: error
          retention-days: 14
