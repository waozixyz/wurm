name: Downloads

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wurm-downloads
  cancel-in-progress: false

jobs:
  build:
    name: Game tests and signed Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZIRAN_PAR_THREADS: '1'
      MAKEFLAGS: -j1
      OMP_NUM_THREADS: '1'
      YUE_DESKTOP_RECOVERY: '0'
    defaults:
      run:
        working-directory: waozixyz/wurm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: waozixyz/wurm
          persist-credentials: false
      - name: Read the release version
        id: version
        run: |
          version=$(sed -n 's/^ *"version": "\([^"]*\)".*/\1/p' version.json)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The locked compiler comes prebuilt, the package checkouts cached, and
      # Ubuntu packages from the canonical archive.
      - name: Set up the locked Ziran, its packages and the build tools
        uses: ziranlang/ziran/.github/actions/setup@979159a55bcf1f9edb9eb8f26ea10aca421412e2
        with:
          project: waozixyz/wurm
          path: ziranlang/ziran
          fetch: true
          packages: >-
            build-essential cmake pkg-config zlib1g-dev ffmpeg libssl-dev libsdl2-dev libcairo2-dev libfreetype-dev libfontconfig-dev libpango1.0-dev libgtk-3-dev libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev xvfb
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned Android SDK tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'build-tools;36.0.0' 'platforms;android-36' 'cmake;3.22.1'
      - name: Verify release metadata
        run: |
          sh update_version.sh
          git diff --exit-code -- version.json
      # Only the Google Play edition may name a Google library, in its build
      # files as in its APK.
      - name: Keep Google libraries out of the normal and F-Droid build files
        uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
        with:
          source: waozixyz/wurm
      # Tests and tools are native Ziran programs; ziran run builds each once.
      - name: Run the game and asset tests
        env:
          LDLIBS: -lz
        run: ziran run --target=c tests/run_local.zi
      - name: Exercise the app on its own private display
        env:
          LDLIBS: -lz
        run: ziran run --target=c tests/run_local.zi -- ui
      - name: Build and exercise the shared account interface
        env:
          LDLIBS: -lz
        run: |
          ziran run --target=c tools/build_desktop.zi
          ziran run --target=c tests/run_local.zi -- account-ui
      - name: Build and play the browser edition
        env:
          LDLIBS: -lz
        run: |
          export EMCC="$(command -v emcc)"
          ziran run --target=c tools/build_web.zi
          CHROMIUM="$(command -v google-chrome || command -v chromium)" ziran run --target=c tests/run_local.zi -- web
      - name: Package the verified browser edition
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/downloads
          (cd build/web && zip -q -r -X "../downloads/wurm-web-v$VERSION.zip" .)
      - name: Build both ARM architectures in one production APK
        env:
          LDLIBS: -lz
        run: ziran run --target=c tools/build_android.zi -- --release --abi universal
      - name: Build the separate Google Play APK
        env:
          LDLIBS: -lz
        run: ziran run --target=c tools/build_android.zi -- --release --abi universal --edition gplay
      # The normal APK is also the F-Droid download; the Google Play APK must
      # still show Play Billing, or the check proves nothing.
      - name: Keep Google libraries out of the normal and F-Droid APK
        uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
        with:
          packages: waozixyz/wurm/build/android/Apfelwurm-universal-release-unsigned.apk
          source: ''
      - name: Find Play Billing in the Google Play APK
        uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
        with:
          packages: waozixyz/wurm/build/android/Apfelwurm-universal-gplay-release-unsigned.apk
          source: ''
          expect-google: 'true'
      - name: Sign and verify the Google-free downloads and Google Play APK
        env:
          KEYSTORE: ${{ secrets.WURM_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.WURM_ANDROID_KEYSTORE_PASSWORD }}
          LDLIBS: -lz
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE" && test -n "$PASSWORD"
          trap 'rm -f "$RUNNER_TEMP/wurm-release.p12" "$RUNNER_TEMP/wurm-password"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/wurm-release.p12"
          printf '%s\n' "$PASSWORD" > "$RUNNER_TEMP/wurm-password"
          ziran run --target=c tools/android_release.zi -- sign build/android/Apfelwurm-universal-release-unsigned.apk \
            --keystore "$RUNNER_TEMP/wurm-release.p12" --password-file "$RUNNER_TEMP/wurm-password"
          ziran run --target=c tools/android_release.zi -- sign build/android/Apfelwurm-universal-gplay-release-unsigned.apk --edition gplay \
            --keystore "$RUNNER_TEMP/wurm-release.p12" --password-file "$RUNNER_TEMP/wurm-password"
      # Publish from this verified workspace: GitHub Actions artifact storage
      # is account-wide and must not block the owner's release downloads.
      - name: Require all download editions and extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "build/downloads/wurm-v$VERSION.apk"
          test -f "build/downloads/wurm-$VERSION-fdroid.apk"
          test -f "build/downloads/wurm-v$VERSION-gplay.apk"
          test -f "build/downloads/wurm-web-v$VERSION.zip"
          cmp "build/downloads/wurm-v$VERSION.apk" "build/downloads/wurm-$VERSION-fdroid.apk"
          # This version's section of CHANGELOG.md, without surrounding blank lines.
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { if (length($0)) { printf "%s", pending; pending = ""; print } else if (started) pending = pending "\n"; if (length($0)) started = 1 }
          ' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md
      - name: Publish this version only after its downloads are ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo "Apfelwurm $VERSION is already published; the signed production build was verified again."
            exit 0
          fi
          if [ "$state" = missing ]; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Apfelwurm $VERSION" --notes-file build/release-notes.md
          fi
          gh release upload "$tag" "build/downloads/wurm-v$VERSION.apk" "build/downloads/wurm-$VERSION-fdroid.apk" "build/downloads/wurm-v$VERSION-gplay.apk" "build/downloads/wurm-web-v$VERSION.zip" --clobber
          gh release edit "$tag" --draft=false --latest
      - name: Install itch.io Butler
        run: |
          curl --fail --show-error --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$RUNNER_TEMP/butler.zip"
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Publish the tested browser and Android editions to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo '::error::Set the ITCH_API_KEY repository secret to enable automatic itch.io updates.'; exit 1; }
          test -f build/web/index.html
          test -f "build/downloads/wurm-v$VERSION.apk"
          butler push build/web waozi/wurm:html5 --userversion "$VERSION"
          butler push "build/downloads/wurm-v$VERSION.apk" waozi/wurm:android --userversion "$VERSION"
          butler status waozi/wurm
      # Arcade follows this release now, not at its next timer, and Breeze
      # then publishes it to the node. RELEASE_FOLLOW_TOKEN may only start
      # workflows in Arcade and Breeze; Game updates takes no input and finds
      # the newest game releases itself. Without it Arcade's timer follows.
      - name: Start Arcade's game update
        env:
          GH_TOKEN: ${{ secrets.RELEASE_FOLLOW_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASE_FOLLOW_TOKEN: Arcade's Game updates picks this release up on its timer."
            exit 0
          fi
          gh workflow run game-updates.yml -R waozixyz/arcade --ref master
