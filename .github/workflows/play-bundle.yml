name: Google Play bundle

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      revision:
        description: Full published Wurm release commit (defaults to this run)
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: Signed Google Play App Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ZIRAN_PAR_THREADS: '1'
      MAKEFLAGS: -j1
      OMP_NUM_THREADS: '1'
      YUE_DESKTOP_RECOVERY: '0'
    concurrency:
      group: wurm-google-play
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    defaults:
      run:
        working-directory: waozixyz/wurm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.revision || github.sha }}
          path: waozixyz/wurm
          persist-credentials: false
      - name: Read the release version
        id: version
        run: |
          version=$(sed -n 's/^ *"version": "\([^"]*\)".*/\1/p' version.json)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$(python3 -c 'import json; print(json.load(open("version.json"))["version_code"])')" >> "$GITHUB_OUTPUT"
      - name: Require an already published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          release = json.loads(subprocess.check_output(
              ['gh', 'release', 'view', 'v' + os.environ['VERSION'], '--json', 'isDraft,publishedAt'], text=True))
          assert not release['isDraft'] and release['publishedAt'], 'Publish the GitHub release first'
          PY
      # The locked compiler comes prebuilt, the package checkouts cached, and
      # Ubuntu packages from the canonical archive.
      - name: Set up the locked Ziran, its packages and the build tools
        uses: ziranlang/ziran/.github/actions/setup@979159a55bcf1f9edb9eb8f26ea10aca421412e2
        with:
          project: waozixyz/wurm
          path: ziranlang/ziran
          fetch: true
          packages: >-
            build-essential cmake pkg-config zlib1g-dev libssl-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned Android SDK tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'build-tools;36.0.0' 'platforms;android-36' 'cmake;3.22.1'
      - name: Verify release metadata
        run: |
          sh update_version.sh
          git diff --exit-code -- version.json
      - name: Build both ARM architectures in one Google Play edition bundle
        env:
          LDLIBS: -lz
        run: ziran run --target=c tools/build_android.zi -- --bundle --abi universal
      - name: Sign with the Apfelwurm upload key and verify
        env:
          KEYSTORE: ${{ secrets.WURM_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.WURM_ANDROID_KEYSTORE_PASSWORD }}
          LDLIBS: -lz
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$PASSWORD"
          curl --fail --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/wurm-release.p12" "$RUNNER_TEMP/wurm-password"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/wurm-release.p12"
          printf '%s\n' "$PASSWORD" > "$RUNNER_TEMP/wurm-password"
          ziran run --target=c tools/android_release.zi -- sign build/android/Apfelwurm-release-unsigned.aab \
            --keystore "$RUNNER_TEMP/wurm-release.p12" --password-file "$RUNNER_TEMP/wurm-password" \
            --bundletool "$RUNNER_TEMP/bundletool.jar"
          cat backup/android-release/play-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: wurm-play-${{ steps.version.outputs.version }}
          path: waozixyz/wurm/build/downloads/wurm-v${{ steps.version.outputs.version }}-gplay.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload only the Google Play edition to internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: xyz.waozi.wurm
          releaseFiles: waozixyz/wurm/build/downloads/wurm-v${{ steps.version.outputs.version }}-gplay.aab
          releaseName: ${{ steps.version.outputs.version }}
          track: internal
          status: completed

  closed-testing:
    needs: bundle
    uses: ./.github/workflows/play-promote.yml
    with:
      version: ${{ needs.bundle.outputs.version }}
      version_code: ${{ needs.bundle.outputs.version_code }}
    secrets: inherit
