<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#202b26">
  <title>Apfelwurm — 200 levels, one little worm</title>
  <meta name="description" content="Guide a little orange worm from apple meadows to the mountains. Play 200 levels free in your browser, with swipe or direction-pad controls and optional account sync and a Dew skin shop.">
  <link rel="canonical" href="https://wurm.waozi.xyz/">
  <meta property="og:title" content="Apfelwurm — 200 levels, one little worm">
  <meta property="og:description" content="Meadow, woodland, lake and mountains. A little orange worm. A long apple adventure. Play free online.">
  <meta property="og:image" content="https://wurm.waozi.xyz/social.jpg">
  <meta property="og:url" content="https://wurm.waozi.xyz/">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#202b26;color:#e0e7d9;font:16px system-ui,sans-serif;overscroll-behavior:none}
    body{overflow:hidden}#canvas-frame{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    #loading{position:absolute;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:linear-gradient(#303c33e8,#202b26e8),url('loading.webp') center/cover;font-size:18px}#loading strong{font-size:32px}#loading[hidden]{display:none}
  </style>
</head>
<body>
  <main id="canvas-frame"><canvas id="canvas" tabindex="0" aria-label="Apfelwurm game: choose swipe or direction pad, collect apples, then leave through the top gate."></canvas><div id="loading" role="status"><strong>A little worm.<br>A long journey.</strong><span>Opening Apfelwurm…</span></div></main>
  <script>
    var Module={canvas:document.getElementById('canvas'),onRuntimeInitialized(){document.getElementById('loading').hidden=true;Module.canvas.focus()},onAbort(){document.getElementById('loading').hidden=false;document.getElementById('loading').textContent='The game could not open. Please reload to try again.'},printErr(text){console.error(text)}};
    // One sign-in for every waozi.xyz site: account.waozi.xyz hands over the
    // shared profile before the game starts, or the game starts without it.
    (function () {
      var started = false;
      function start() {
        if (started) return;
        started = true;
        var game = document.createElement('script');
        game.src = 'game.js';
        document.body.appendChild(game);
      }
      var shared = document.createElement('script');
      shared.src = 'https://account.waozi.xyz/share.js';
      shared.onload = function () { WaoziAccount.attach(Module, 2500).then(start, start); };
      shared.onerror = start;
      setTimeout(start, 4000);
      document.head.appendChild(shared);
    })();
  </script>
</body>
</html>
