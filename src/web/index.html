<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#244734">
  <title>Apfelwurm — 200 levels, one little worm</title>
  <meta name="description" content="Guide a little orange worm from apple meadows to the mountains. Play 200 levels free in your browser, with swipe or direction-pad controls and progress saved on your device.">
  <link rel="canonical" href="https://wurm.waozi.xyz/">
  <meta property="og:title" content="Apfelwurm — 200 levels, one little worm">
  <meta property="og:description" content="Meadow, woodland, lake and mountains. A little orange worm. A long apple adventure. Play free online.">
  <meta property="og:image" content="https://wurm.waozi.xyz/assets/art/title.png">
  <meta property="og:url" content="https://wurm.waozi.xyz/">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#e5edd2;color:#244734;font:16px system-ui,sans-serif;overscroll-behavior:none}
    body{display:flex;flex-direction:column}header{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(16px,env(safe-area-inset-right));background:#fffaea;border-bottom:1px solid #cdddba}
    a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}nav{display:flex;gap:20px;font-size:14px}#canvas-frame{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    #loading{position:absolute;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:linear-gradient(#fffaeae8,#e5edd2e8),url('assets/art/title.png') center/cover;font-size:18px}#loading strong{font-size:32px}#loading[hidden]{display:none}
    @media(max-width:500px){header{height:42px}nav{gap:12px;font-size:12px}}
  </style>
</head>
<body>
  <header><a href="https://waozi.xyz/studio/#apfelwurm"><strong>Apfelwurm</strong> · Waozi</a><nav><a href="https://github.com/waozixyz/wurm/releases/latest">Android</a><a href="https://github.com/waozixyz/wurm">Source</a><a href="privacy.html">Privacy</a></nav></header>
  <main id="canvas-frame"><canvas id="canvas" tabindex="0" aria-label="Apfelwurm game: choose swipe or direction pad, collect apples, then leave through the top gate."></canvas><div id="loading" role="status"><strong>A little worm.<br>A long journey.</strong><span>Opening Apfelwurm…</span></div></main>
  <script>
    var Module={canvas:document.getElementById('canvas'),onRuntimeInitialized(){document.getElementById('loading').hidden=true;Module.canvas.focus()},onAbort(){document.getElementById('loading').hidden=false;document.getElementById('loading').textContent='The game could not open. Please reload to try again.'},printErr(text){console.error(text)}};
  </script>
  <script src="game.js" defer></script>
</body>
</html>
