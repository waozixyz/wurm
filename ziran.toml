[package]
name = "Apfelwurm"
entry = "src/app.zi"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "e4e8efa4a92f36e2fb0cea1d56b11471afa68621"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "1cd873fda5d12cd4dd562956da94cee33c3e364c"

[install]
bin = "wurm"

[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
native_artifacts = "kryon:renderer-raylib"
native_platform = "linux-x86_64-gnu"
backend = "desktop"
library = "SDL2"
# Sizes the window from WURM_WINDOW so landscape and portrait layouts can
# be exercised on the desktop.
host = "src/desktop_host.zi"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"
assets = "assets"

[tool.kryon.profiles.android]
backend = "android"

[tool.kryon.profiles.shot]
backend = "pixmap"
library = "SDL2"
host = "src/shot_host.zi"

# Private Xvfb tests exercise all dialogs without changing the shipped host.
[tool.kryon.profiles.modal-test]
backend = "desktop"
library = "SDL2"
host = "src/modal_test_host.zi"

[tool.kryon.install]
profile = "desktop"
name = "Apfelwurm"
comment = "A Kryon and Ziran worm game"
categories = "Game;"
working_directory = "."

# The application id.
[tool.kryon.android]
package = "xyz.waozi.wurm"
abis = "arm64-v8a,armeabi-v7a"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "3515cdf3af20e79001f7774eed224e94180540ed"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "075784438af94fe4a0aba48ed4d8c7208c161bf1"

[dependencies.crypto]
git = "https://github.com/ziranlang/crypto.git"
ref = "master"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "ce85309d693d9cae8a65c3e8750b6cde864c723e"
